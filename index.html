<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Diệt Côn Trùng - Bản Thư Giãn</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #27ae60;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        #scoreboard {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
        }

        .bug {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .bug:active {
            transform: scale(0.6);
        }

        #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 12px;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }

        #start-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="scoreboard">
            Điểm: <span id="score">0</span> | 
            Kỷ lục: <span id="highscore">0</span> | 
            Thời gian: <span id="timer">30</span>s
        </div>
        
        <div id="start-screen">
            <h1>Trò Chơi Diệt Côn Trùng 🐛🐜🪰</h1>
            <p>Phiên bản chậm rãi hơn để bạn dễ thao tác!<br>Tiêu diệt Kiến, Ruồi và Bọ Rùa trong 30 giây.</p>
            <button id="start-btn" onclick="startGame()">Bắt Đầu</button>
        </div>
    </div>

    <script>
        let score = 0;
        let highscore = 0;
        let timeLeft = 30;
        let gameInterval;
        let bugSpawner;
        let isPlaying = false;

        // Khởi tạo AudioContext cho âm thanh
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'squish') {
                // Tiếng đập côn trùng
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'gameover') {
                // Tiếng hết giờ
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        const scoreDisplay = document.getElementById('score');
        const highscoreDisplay = document.getElementById('highscore');
        const timerDisplay = document.getElementById('timer');
        const startScreen = document.getElementById('start-screen');
        const gameContainer = document.getElementById('game-container');

        // Danh sách các loại côn trùng (Đã tăng thời gian tồn tại để chậm hơn)
        const bugTypes = [
            { emoji: '🐜', points: 10, size: 50, duration: 2500 }, // Kiến thường (tồn tại 2.5 giây)
            { emoji: '🪰', points: 15, size: 40, duration: 2000 }, // Ruồi (tồn tại 2 giây)
            { emoji: '🐞', points: 20, size: 60, duration: 3000 }  // Bọ rùa (tồn tại 3 giây)
        ];

        function startGame() {
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            startScreen.style.display = 'none';
            isPlaying = true;

            // Xóa hết côn trùng cũ
            document.querySelectorAll('.bug').forEach(bug => bug.remove());

            // Đếm ngược thời gian
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Sinh ngẫu nhiên côn trùng thưa hơn (1000ms = 1 giây ra 1 con thay vì 0.5 giây như trước)
            bugSpawner = setInterval(spawnBug, 1000);
        }

        function spawnBug() {
            if (!isPlaying) return;

            // Chọn ngẫu nhiên loại côn trùng
            const randomType = bugTypes[Math.floor(Math.random() * bugTypes.length)];

            const bug = document.createElement('div');
            bug.classList.add('bug');
            bug.innerHTML = randomType.emoji;
            bug.style.width = randomType.size + 'px';
            bug.style.height = randomType.size + 'px';
            bug.style.fontSize = (randomType.size * 0.6) + 'px';

            // Random vị trí xuất hiện
            const maxX = window.innerWidth - randomType.size - 10;
            const maxY = window.innerHeight - randomType.size - 60;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY) + 60;

            bug.style.left = randomX + 'px';
            bug.style.top = randomY + 'px';

            // Sự kiện khi bấm vào côn trùng
            bug.addEventListener('click', () => {
                if (!isPlaying) return;
                score += randomType.points;
                scoreDisplay.textContent = score;
                
                playSound('squish');

                bug.style.transform = 'scale(0)';
                setTimeout(() => bug.remove(), 100);
            });

            gameContainer.appendChild(bug);

            // Tự động biến mất chậm hơn theo thời gian cấu hình ở trên
            setTimeout(() => {
                if (bug.parentElement) {
                    bug.remove();
                }
            }, randomType.duration);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(bugSpawner);

            playSound('gameover');

            if (score > highscore) {
                highscore = score;
                highscoreDisplay.textContent = highscore;
            }

            document.querySelectorAll('.bug').forEach(bug => bug.remove());

            startScreen.style.display = 'block';
            startScreen.querySelector('h1').textContent = 'Hết Giờ! 🎉';
            startScreen.querySelector('p').innerHTML = `Tổng điểm của bạn: <b>${score}</b><br>Kỷ lục hiện tại: <b>${highscore}</b>`;
            document.getElementById('start-btn').textContent = 'Chơi Lại';
        }
    </script>
</body>
</html>
